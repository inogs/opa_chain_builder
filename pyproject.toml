[project]
name = "opa-chain-builder"
version = "0.1.0"
description = "Tooling to build OPA compiler/toolchain chains via Spack"
authors = [
    {name = "Stefano Piani",email = "spiani@ogs.it"}
]
requires-python = ">=3.11"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)"
]

[project.scripts]
opa-chain-builder = "opa_chain_builder.__main__:main"

[tool.poetry]
packages = [
    {include = "opa_chain_builder", from = "src"}
]
include = [
    {path = "src/opa_chain_builder/config_files/*.toml", format = ["sdist", "wheel"]}
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pre-commit = "^4.6.2"
deptry = { version = ">0.25.0", python = "<4.0" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D100",
    "D104",     # Ignore missing docstring in public package
    "D203",
    "D212",
    "S101",     # Ignore the use of asserts
    "COM812",   # Ignore missing trailing commas (handled already by the formatter)
    "S603",     # Ignore subprocess call checks (we only invoke known, fixed executables)
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",       # Ignore all errors related with the use of the docstrings
    "PLR2004", # Ignore the presence of magic numbers
    "ARG",     # Ignore unused args
    "ANN",     # Ignore problems related with annotations
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B603", "B404"]
